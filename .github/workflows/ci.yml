name: CI

on:
  push:
    branches: [main, modernize]
  pull_request:

jobs:
  unit-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest test/unit/ -v

  stub-tests:
    name: Nextflow lint + stub tests
    runs-on: ubuntu-latest
    env:
      NXF_VER: "26.04.4"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: nextflow-io/setup-nextflow@v2
        with:
          version: "26.04.4"

      - name: Lint Nextflow code
        run: nextflow lint .

      - name: Run stub tests
        run: bash test/run_stub_tests.sh
